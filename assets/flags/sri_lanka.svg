<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- Yellow border -->
  <rect x="0" y="0" width="200" height="100" fill="#ffcc00"/>
  <!-- Inner flag area -->
  <rect x="4" y="4" width="192" height="92" fill="#8d153a"/>
  <!-- Green and orange hoist stripes -->
  <rect x="4" y="4" width="18" height="92" fill="#005f20"/>
  <rect x="22" y="4" width="18" height="92" fill="#ff8c00"/>
  <!-- Cartoon golden lion in center -->
  <g transform="translate(100, 50)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="28" ry="32" fill="#ffcc00"/>
    <!-- Mane -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffcc00" stroke-width="6" stroke-dasharray="8 6"/>
    <!-- Ears -->
    <circle cx="-18" cy="-22" r="8" fill="#ffcc00"/>
    <circle cx="18" cy="-22" r="8" fill="#ffcc00"/>
    <!-- Face -->
    <ellipse cx="0" cy="2" rx="16" ry="18" fill="#ffe680"/>
    <!-- Anime eyes -->
    <ellipse cx="-6" cy="-2" rx="5" ry="7" fill="#333"/>
    <ellipse cx="6" cy="-2" rx="5" ry="7" fill="#333"/>
    <circle cx="-4" cy="-4" r="2" fill="white"/>
    <circle cx="8" cy="-4" r="2" fill="white"/>
    <!-- Nose and mouth -->
    <ellipse cx="0" cy="8" rx="3" ry="2" fill="#cc3333"/>
    <path d="M-4 14 Q0 18 4 14" stroke="#333" stroke-width="1.5" fill="none"/>
    <!-- Sword held by paw -->
    <rect x="16" y="-6" width="22" height="4" fill="#dddddd" transform="rotate(-30 16 -6)"/>
    <rect x="34" y="-16" width="6" height="12" fill="#ffcc00" transform="rotate(-30 34 -16)"/>
    <!-- Paw -->
    <circle cx="14" cy="8" r="7" fill="#ffcc00"/>
  </g>
  <!-- Stylized bo leaves in corners -->
  <g fill="#ffcc00">
    <!-- Top left -->
    <path d="M32 12 Q40 4 48 12 Q40 20 32 12 Z"/>
    <!-- Top right -->
    <path d="M152 12 Q160 4 168 12 Q160 20 152 12 Z"/>
    <!-- Bottom left -->
    <path d="M32 88 Q40 80 48 88 Q40 96 32 88 Z"/>
    <!-- Bottom right -->
    <path d="M152 88 Q160 80 168 88 Q160 96 152 88 Z"/>
  </g>
</svg>